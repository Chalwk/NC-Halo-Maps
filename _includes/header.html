<div class="header-top">
    <div class="brand">
        <i aria-hidden="true" class="fas fa-compass brand-icon"></i>
        <div class="brand-text">
            <h1>{{ site.title }}</h1>
            <p class="brand-tagline">Custom maps for Halo: PC/CE</p>
        </div>
    </div>
</div>

<div class="nav-toggle">
    <button aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
</div>

<nav aria-label="Main navigation" class="main-nav">
    <ul>
        <li><a class="nav-link {% if page.url == '/' or page.url == '/index' or page.url == '/index.html' %}active{% endif %}"
                href="{{ site.baseurl }}/">Home</a></li>
        <li><a class="nav-link {% if page.url == '/maps' or page.url == '/maps.html' %}active{% endif %}"
                href="{{ site.baseurl }}/maps">Maps</a></li>
        <li><a class="nav-link" href="{{ site.links.releases }}" rel="noopener" target="_blank">
                Releases <i class="fas fa-arrow-up-right-from-square fa-xs"></i>
            </a></li>
    </ul>
</nav>
